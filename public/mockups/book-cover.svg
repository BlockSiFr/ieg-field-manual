<svg xmlns="http://www.w3.org/2000/svg" width="640" height="860" viewBox="0 0 640 860" role="img" aria-labelledby="title desc">
  <title id="title">IEG Field Manual hardcover front cover</title>
  <desc id="desc">Near-black field manual cover with ivory title panel and signal-red rule.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b1b"/>
      <stop offset="100%" stop-color="#0e0f0f"/>
    </linearGradient>
  </defs>
  <rect width="640" height="860" fill="url(#shade)"/>
  <rect x="48" y="48" width="544" height="764" fill="none" stroke="#eee8dc" stroke-opacity="0.22"/>
  <rect x="72" y="88" width="120" height="4" fill="#a92f27"/>
  <text x="72" y="140" font-family="Arial Narrow, Arial, sans-serif" font-size="22" letter-spacing="6" fill="#a9a39a">FIELD MANUAL</text>
  <text x="72" y="260" font-family="Arial Narrow, Arial, sans-serif" font-size="96" font-weight="700" fill="#f2ede4">IEG Field Manual</text>
  <text x="72" y="330" font-family="Georgia, serif" font-size="28" fill="#eee8dc">of AI Security</text>
  <text x="72" y="372" font-family="Georgia, serif" font-size="28" fill="#eee8dc">and Countermeasures</text>
  <text x="72" y="470" font-family="Georgia, serif" font-size="20" fill="#a9a39a">AI systems do not fail loudly.</text>
  <text x="72" y="500" font-family="Georgia, serif" font-size="20" fill="#a9a39a">They fail quietly, and still act.</text>
  <text x="72" y="720" font-family="ui-monospace, monospace" font-size="14" letter-spacing="2" fill="#a9a39a">220+ VULNERABILITIES  ·  40 CHAPTERS</text>
  <text x="72" y="760" font-family="ui-monospace, monospace" font-size="14" letter-spacing="2" fill="#a9a39a">MITRE ATLAS  ·  OWASP LLM  ·  NIST AI RMF</text>
  <text x="72" y="800" font-family="ui-monospace, monospace" font-size="14" fill="#eee8dc">BLOCK SIFR LLC</text>
</svg>
