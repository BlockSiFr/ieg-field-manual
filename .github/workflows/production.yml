name: Production
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run content:pipeline || true
      - run: npm test
      - run: npm run build
      - name: Deploy SWA
        uses: Azure/static-web-apps-deploy@v1
        if: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: api
          output_location: dist
      - name: Health check reminder
        run: echo "Verify https://dastor.blocksifr.com/api/health after DNS cutover"
