name: Production
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    environment: production
    env:
      SWA_DEPLOY_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Require Azure Static Web Apps deployment credentials
        run: |
          if [ -z "$SWA_DEPLOY_TOKEN" ]; then
            echo "::error::Missing AZURE_STATIC_WEB_APPS_API_TOKEN in the production environment or repository secrets."
            exit 1
          fi
      - run: npm ci
      - run: npm run validate-content
      - run: npm run verify-assets
      - run: npm test
      - run: npm run build
      - name: Deploy production to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: api
          output_location: dist
      - name: Verify canonical category page is published
        shell: bash
        run: |
          set -euo pipefail
          url="https://ieg.blocksifr.com/consequence-intelligence"
          for attempt in $(seq 1 8); do
            body=$(curl --fail --location --silent --show-error --max-time 20 "$url" || true)
            if grep -Fq "Know what a system can cause" <<< "$body"; then
              echo "Verified Consequence Intelligence at $url"
              exit 0
            fi
            echo "Category page not visible yet (attempt $attempt/8)"
            sleep 10
          done
          echo "::error::Published category page is not visible at $url"
          exit 1
